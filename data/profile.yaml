# Shown only for the `ai` variant (or when a job mentions agentic / AI-assisted development).
ai_practice:
  - Use Claude Code and Cursor as my main development environment for production work at PriceEstimator.ai and for my personal projects.
  - Break features into scoped specs and run parallel agents across API, UI, and test work in isolated branches, guided by CLAUDE.md rule files that set repo conventions.
  - Verify agent output through test loops and line-by-line review before merging, and rewrite or reject changes that don't meet the repo's conventions or security rules.
  - Keep secrets and client data out of prompts, and personally review all auth, billing, and payment code.

