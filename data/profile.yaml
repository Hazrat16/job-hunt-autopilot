projects:
  - name: SmartJobHub
    url: https://github.com/Hazrat16/smart-jobhub
    descriptions:
      - tags: [devops, cloud]
        title: "SmartJobHub: CI/CD and AWS platform for a job portal"
        text: Built Terraform modules for VPC, ALB, ECS Fargate, ElastiCache, Secrets Manager, and CloudFront, with matching staging and production environments. Developed GitHub Actions pipelines for tests, Docker builds, Trivy vulnerability scanning, and CodeQL security analysis. Deployed a single versioned image to staging, then to production after approval, using GitHub OIDC instead of static AWS keys. Set up Prometheus, Grafana, and Loki, CloudWatch alarms to SNS, Sentry, and AWS budget alerts. Improved deployment safety with ECS circuit-breaker rollback, smoke tests, and autoscaling. Wrote the runbook, nine Architecture Decision Records (ADRs), and ran a backup restoration drill.
      - tags: [fullstack, backend, ai]
        title: "SmartJobHub: job portal platform"
        text: Built a job portal for jobseekers, employers, and admins, with job posting and search, applications with status history, saved jobs, company profiles, notifications, and role-based access. Added real-time chat with Socket.IO and a Redis adapter so messages and online status work across several servers. Integrated SSLCommerz payments, Cloudinary uploads, PDF resume parsing, and a BullMQ email queue, and exposed Prometheus metrics from the API. Covered the API with 15 test suites (Node test runner, Supertest) and the web app with a Playwright smoke test; deployed on AWS ECS Fargate with Terraform and GitHub Actions.
      - tags: [frontend]
        title: "SmartJobHub: job portal web app"
        text: Built a 29-page app for jobseekers, employers and admins, with job search and filters, applications, saved jobs, company profiles, payments, an analytics dashboard and a resume-fit tool that suggests resume bullets. Added real-time chat and notifications with the Socket.IO client, forms with React Hook Form, dark mode and ARIA labelling. Wrote Playwright tests for sign-up, sign-in and key pages that run in CI; deployed on AWS with Docker and GitHub Actions.

  - name: Doctor Appointment Platform
    url: https://github.com/Hazrat16/appointment
    descriptions:
      - tags: [devops, fullstack, backend, ai]
        title: "Doctor Appointment Platform: AWS infrastructure and CI/CD"
        text: Built and managed CI/CD and AWS infrastructure for a full-stack booking platform (Next.js, Express, MongoDB). Automated TypeScript builds, CodeQL security scanning, and Docker image publishing to GitHub Container Registry (GHCR) using GitHub Actions. Provisioned AWS infrastructure (VPC, security groups, EC2) with Terraform and configured Linux hosts with Ansible, including Docker, MongoDB backups, Nginx, TLS, rolling deployments, and application health checks.
      - tags: [cloud]
        title: "Doctor Appointment Platform: cloud infrastructure and documentation"
        text: Provisioned AWS network and compute (VPC, security groups, EC2) with Terraform, and configured and maintained Linux hosts with Ansible (Nginx with TLS, MongoDB with automated backups, health-check playbook, secrets managed with Ansible Vault). Set up a GitHub Actions CI/CD pipeline with CodeQL security scanning that publishes Docker images to GHCR. Wrote setup, deployment, and operational documentation so the environment is reproducible by others.
      - tags: [frontend]
        title: Doctor Appointment Platform
        text: Built a booking app with separate patient, doctor and admin dashboards behind role-based route guards. Patients search doctors and book slots, doctors manage availability and visits, and admins verify doctors and manage users. Built a reusable UI kit (buttons, inputs, selects, cards, confirm dialogs) and validated forms with Zod.

  - name: Real-Time Inventory Reservation System
    url: https://github.com/Hazrat16/real-time-high-trafic-inventory
    descriptions:
      - tags: [devops, cloud]
        title: "Real-Time High-Traffic Inventory: Jenkins CI/CD on AWS EC2"
        text: Built a Jenkins CI/CD pipeline on AWS EC2, triggered by GitHub webhooks, to automate builds, tests, and deployments. Used Docker Compose for PostgreSQL integration tests, including a 100-request concurrency test, ensuring failed builds never deploy. Automated deployment with Docker Compose, Nginx, Node.js, and PostgreSQL, with secure secrets, versioned images, and Prisma migrations. Improved reliability with server hardening, timeouts, rollback support, and a deployment runbook.
      - tags: [fullstack, backend, ai]
        title: Real-Time Inventory Reservation System (Jenkins CI/CD)
        text: Built a concurrency-safe, real-time inventory reservation system (Express/Prisma/Socket.IO, React/Vite, pnpm monorepo) preventing overselling via row-level DB locking and transactional reservations with automatic expiry. Built a Jenkins pipeline (webhook-triggered, multi-stage Docker builds, integration tests, automated deploy and smoke tests) self-hosted on AWS EC2 behind Nginx.
      - tags: [frontend]
        title: A Real-time Sneaker Drop Inventory
        text: Built the storefront for a limited-stock product drop where many shoppers reserve at once. Stock updates live over Socket.IO, a live countdown shows each 60-second hold before checkout, and skeleton loaders and toasts keep the UI responsive under load. Shared TypeScript types between the React app and the Express/Prisma API in a pnpm monorepo.

  - name: Kubernetes Deployment on Amazon EKS
    url: https://github.com/Hazrat16/student-management-with-eks
    descriptions:
      - tags: [devops, cloud]
        title: Kubernetes Deployment on Amazon EKS
        text: Deployed a two-tier, MySQL-backed application to a Kubernetes cluster on Amazon EKS using kubectl and eksctl, including namespace, deployment, and service manifests; documented cluster setup and teardown to manage cloud costs.

  - name: Terraform AWS Networking and Compute Module
    url: https://github.com/Hazrat16/terraform-launchpad
    descriptions:
      - tags: [devops, cloud]
        title: Terraform AWS Networking and Compute Module
        text: Built a modular Terraform configuration provisioning a VPC, subnets, internet gateway, route tables, security groups, and an EC2 web server, with separated backend, variables, and outputs files, and a Bash user-data script for instance bootstrapping.

  - name: Ansible Multi-Role Linux Platform
    descriptions:
      - tags: [cloud, devops]
        title: Ansible Multi-Role Linux Platform (Homelab Classroom Kit)
        text: Configured and maintained a 3-node Linux platform (control, web, database) on AWS EC2 using Ansible roles for Nginx (with Let's Encrypt/self-signed TLS), application deployment, PostgreSQL, and backups.

  - name: AI SQL Assistant
    url: https://github.com/Hazrat16/ai-sql-assistant-backend
    descriptions:
      - tags: [fullstack, backend, ai]
        title: AI SQL Assistant
        text: Built a full-stack PostgreSQL tool that turns plain-English questions into validated, read-only SQL with explanations. Fastify backend with schema introspection, OpenAI/Ollama integration, and an offline fallback; AST-based safety checks reject any generated SQL that isn't a safe read-only query. Next.js frontend with results view, schema browser, and connection management. Runs with Docker, migrations, and seeded datasets.

  - name: Open-source React hooks
    url: https://www.npmjs.com/package/block-browser-back
    descriptions:
      - tags: [frontend, fullstack]
        title: "Open source: React hooks on npm"
        text: Published two React hooks on npm, block-browser-back and checkout-risk-sdk (Checkout.com fraud-detection integration), with about 400 downloads in the past year.

